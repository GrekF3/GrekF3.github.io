name: Update GitHub activity

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public data and standard chart cache
        run: python scripts/update-stats.py
      - name: Commit changed activity assets
        run: |
          git add -- assets/github-stats.json assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "Activity assets are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public GitHub activity"
          git push
